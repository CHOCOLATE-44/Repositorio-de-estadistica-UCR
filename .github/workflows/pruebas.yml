name: Pruebas

on:
  pull_request:
    paths: ["scripts/**", "sitio/**", "tests/**", "cursos.json", "config.json", ".github/ISSUE_TEMPLATE/**"]
  push:
    branches: [main]
    paths: ["scripts/**", "sitio/**", "tests/**", "cursos.json", "config.json", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_consulta.js
