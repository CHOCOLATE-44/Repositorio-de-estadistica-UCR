name: Subir apunte desde issue

# Permite subir apuntes sin saber Git: el formulario «Subir un apunte» crea un
# issue con el PDF adjunto y este workflow abre el Pull Request.
on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Número del issue «Subir un apunte» a procesar de nuevo
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  subir:
    concurrency:   # en el job: un evento ignorado no cancela al que sí procesa
      group: subir-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: true
    # Se reconoce por la etiqueta o por el título que pone el formulario («Apunte: …»).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       (contains(github.event.issue.labels.*.name, 'subir-apunte') || startsWith(github.event.issue.title, 'Apunte:')) &&
       (github.event.action != 'labeled' || github.event.label.name == 'subir-apunte'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt   # Pillow: unir fotos en un PDF

      - name: Descargar el archivo adjunto
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_MANUAL: ${{ inputs.issue }}
        run: python scripts/subir_desde_issue.py

      - name: Crear o actualizar el Pull Request
        if: steps.prep.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARPETA: ${{ steps.prep.outputs.carpeta }}
          ARCHIVOS: ${{ steps.prep.outputs.archivos }}
          RAMA: ${{ steps.prep.outputs.rama }}
          CURSO: ${{ steps.prep.outputs.curso }}
          AUTOR_NOMBRE: ${{ steps.prep.outputs.autor_nombre }}
          AUTOR_EMAIL: ${{ steps.prep.outputs.autor_email }}
          TITULO: ${{ steps.prep.outputs.titulo }}
          ISSUE: ${{ steps.prep.outputs.issue }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # El autor del commit es quien subió el apunte (así se le atribuye y no puede autovotarse).
          git config user.name "$AUTOR_NOMBRE"
          git config user.email "$AUTOR_EMAIL"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RAMA"
          git add -- "$CARPETA"
          git commit -m "Agregar apunte de $CURSO" -m "Subido desde el issue #$ISSUE."
          git push --force origin "$RAMA"

          PR=$(gh pr list --head "$RAMA" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            { printf 'Apunte subido por @%s desde el formulario (%s archivo/s).\n\n' "$AUTOR_NOMBRE" "$ARCHIVOS"
              git diff --name-only HEAD~1 HEAD | sed 's/^/- `/; s/$/`/'
              printf '\nCloses #%s\n' "$ISSUE"; } > cuerpo.md
            URL=$(gh pr create --base "$BASE" --head "$RAMA" --title "[$CURSO] $TITULO" --body-file cuerpo.md)
            PR="${URL##*/}"
          fi
          gh workflow run validar-apunte.yml --ref "$BASE" -f pr="$PR"
          gh issue comment "$ISSUE" --body "📄 Listo: se creó el Pull Request #$PR con su apunte. En unos minutos el robot comentará allí si el contenido corresponde al curso. Si coincide con el curso, se publicará solo, aparecerá en el ranking y este issue se cerrará."
