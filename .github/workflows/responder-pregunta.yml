name: Responder pregunta

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: pregunta-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  responder:
    if: contains(github.event.issue.labels.*.name, 'pregunta') || startsWith(github.event.issue.title, 'Pregunta:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0   # autores y fechas de los apuntes salen del historial
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Responder con Gemini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAMA_PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: python scripts/responder_pregunta.py --evento "$GITHUB_EVENT_PATH"
