name: Procesar voto

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  actions: write   # para disparar la actualización del ranking

concurrency:
  group: voto-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  procesar:
    # Solo issues de voto. De los eventos de etiquetas, solo nos interesa que el
    # mantenedor anule (o reactive) un voto con la etiqueta «voto-anulado».
    if: >-
      contains(github.event.issue.labels.*.name, 'voto') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'voto-anulado')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0   # historial completo para saber quién subió cada apunte
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar voto
        if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/votos.py --evento "$GITHUB_EVENT_PATH"

      - name: Actualizar ranking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publicar.yml --repo "$GITHUB_REPOSITORY"
